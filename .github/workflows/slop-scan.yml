# Ejemplo de gate en integración continua (proceso enforceado).
# Copia al repo que quieras auditar y ajusta RUTA, MARCA, PERFIL y umbrales.
#
# Recomendación: en legacy usa --since-baseline --fail-on-new-drift.
# Con DESIGN.md / slop-init, añade --require-contrato.

name: slop-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Obtener slop-tools
        uses: actions/checkout@v4
        with:
          repository: cervantesh/slop-tools
          path: .slop-tools

      # Proceso completo: score + contrato (si hay) + brief + last-gate.json
      - name: Gate
        run: |
          node .slop-tools/scripts/slop-gate.mjs ./src \
            --profile producto \
            --brand "TuMarca" \
            --min-score 70 \
            --since-baseline --fail-on-new-drift

      - name: Resumen
        if: always()
        run: |
          {
            echo '## slop-gate'
            echo '```'
            cat ./src/.slop/last-gate.json 2>/dev/null || cat ./.slop/last-gate.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
